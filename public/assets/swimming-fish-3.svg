<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <linearGradient id="angelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Long Dorsal Wing -->
  <path d="M55 58 C 45 25, 60 5, 68 2 C 72 15, 75 40, 70 58 Z" fill="url(#wingGrad)" />
  <!-- Long Ventral Wing -->
  <path d="M55 82 C 45 115, 60 135, 68 138 C 72 125, 75 100, 70 82 Z" fill="url(#wingGrad)" />
  <!-- Tail -->
  <path d="M85 70 L 125 45 L 115 70 L 128 95 Z" fill="#38bdf8" opacity="0.75" />
  <!-- Body (Angelfish Diamond shape) -->
  <path d="M22 70 C 40 50, 60 52, 86 70 C 60 88, 40 90, 22 70 Z" fill="url(#angelGrad)" />
  <!-- Stripes -->
  <path d="M48 56 L 46 84" stroke="#0f172a" stroke-width="2" opacity="0.4" />
  <path d="M64 54 L 62 86" stroke="#0f172a" stroke-width="2" opacity="0.4" />
  <!-- Eye -->
  <circle cx="34" cy="68" r="3" fill="#facc15" />
  <circle cx="34" cy="68" r="1.5" fill="#000" />
</svg>
